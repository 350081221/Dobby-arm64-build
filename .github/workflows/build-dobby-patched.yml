name: Build patched Dobby Android arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Download Dobby source
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git Dobby

      - name: Apply patch
        run: |
          sed -i 's|mnt/data/dobby_work/Dobby-master/||g' dobby_instrument_arm64_lr_fp.patch
          cd Dobby
          git apply ../dobby_instrument_arm64_lr_fp.patch
      
      - name: Build Android arm64 static library
        run: |
          cd Dobby
          mkdir -p build-android-arm64
          cmake -S . -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDOBBY_GENERATE_SHARED=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DDOBBY_DEBUG=OFF

          cmake --build build-android-arm64 --target dobby_static -j$(nproc)

      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          name: libdobby-patched-android-arm64
          path: Dobby/build-android-arm64/libdobby_static.a
